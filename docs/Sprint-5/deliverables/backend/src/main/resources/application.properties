# 1. APPLICATION
spring.application.name=CareerUp
server.address=127.0.0.1
server.port=${PORT:8085}
# 2. MYSQL CONNECTION (MATCH THESE TO INTELLIJ)
# DB_URL/DB_USER/DB_PASSWORD are environment overrides. The launcher supplies the actual local connection.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3315/careerup_sprint5?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:careerup_app}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
# 3. SESSION AND ERROR SETTINGS
# CHANGE HERE: server.servlet.session.timeout=5m means five minutes without server activity.
server.servlet.session.timeout=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# 4. PERSISTENT UPLOADS — private local files, never packaged or pushed to GitHub.
# Limits and supported formats are labeled in MediaController.java and requests.js.
careerup.upload-dir=${CAREERUP_UPLOAD_DIR:.local/uploads}
spring.datasource.hikari.connection-timeout=5000
